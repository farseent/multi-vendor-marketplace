name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Phase 9: fail the build on high or critical advisories (moderate/low are reported only).
      - run: npm run audit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
